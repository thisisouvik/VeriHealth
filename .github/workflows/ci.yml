name: VeriHealth CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: Compile the V2 Compact smart contract ──────────────────────────
  smart-contracts:
    name: Smart Contract CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Compact Compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.local/bin
          key: compact-compiler-v0.5.1

      - name: Install Compact Compiler
        run: |
          curl --proto "=https" --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Compile V2 Compact Circuit
        run: |
          mkdir -p contracts/artifacts
          compact compile contracts/src/verihealth-v2.compact contracts/artifacts

      - name: Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: contracts/artifacts/
          retention-days: 30

  # ── Job 2: TypeScript + Next.js Build (depends on smart-contracts) ────────
  frontend:
    name: Frontend Checks & Build
    runs-on: ubuntu-latest
    needs: smart-contracts   # Ensures contract compiles before frontend build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Download Compiled Contract Artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts
          path: contracts/artifacts/

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/verihealth' }}

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_MIDNIGHT_NETWORK: preprod
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/verihealth' }}
          ADMIN_PUBLIC_KEY: ${{ secrets.ADMIN_PUBLIC_KEY || 'ci-admin-placeholder' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'ci-secret-placeholder' }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET || 'ci-deploy-placeholder' }}
