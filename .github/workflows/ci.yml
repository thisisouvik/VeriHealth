name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Master orchestration pipeline — calls all checks in the correct order.
# Individual jobs also run as standalone badges via their own workflow files.

jobs:
  smart-contracts:
    name: Smart Contract Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Compact Compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.local/bin
          key: compact-compiler-v0.5.1

      - name: Install Compact Compiler
        run: |
          curl --proto "=https" --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Compile verihealth-v2.compact
        run: |
          mkdir -p contracts/artifacts
          compact compile contracts/src/verihealth-v2.compact contracts/artifacts

      - name: Upload Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts-ci
          path: contracts/artifacts/
          retention-days: 7

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/verihealth' }}
      - run: npx tsc --noEmit

  test:
    name: Jest Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/verihealth' }}
      - name: Run 50 Tests
        run: npm run test -- --passWithNoTests --forceExit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/verihealth' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'ci-secret-placeholder' }}

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [smart-contracts, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Download Compiled Contract Artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts-ci
          path: contracts/artifacts/
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/verihealth' }}
      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/verihealth' }}
          NEXT_PUBLIC_MIDNIGHT_NETWORK: preprod
          ADMIN_PUBLIC_KEY: ${{ secrets.ADMIN_PUBLIC_KEY || 'ci-admin-placeholder' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'ci-secret-placeholder' }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET || 'ci-deploy-placeholder' }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY || '' }}
