name: Compact Smart Contract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Compact Compiler
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh > install.sh
        COMPACT_INSTALL_DIR=$GITHUB_WORKSPACE/bin sh install.sh

    - name: Verify Compact Installation
      run: |
        $GITHUB_WORKSPACE/bin/compactc --version

    - name: Compile Contracts
      run: |
        cd contracts
        $GITHUB_WORKSPACE/bin/compactc compile ./src/verihealth.compact
