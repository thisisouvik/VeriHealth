name: Compact Smart Contract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Raw Compiler (v0.34.0)
      run: |
        curl -sL -o compactc.zip https://github.com/midnightntwrk/compact/releases/download/compactc-v0.34.0/compactc_v0.34.0_x86_64-unknown-linux-musl.zip
        unzip compactc.zip -d compact-bin
        chmod +x compact-bin/compactc

    - name: Compile Contracts
      run: |
        ./compact-bin/compactc --version
        
        cd contracts
        # The raw compiler syntax (bypassing multiplexer)
        ../compact-bin/compactc compile ./src/verihealth.compact || ../compact-bin/compactc ./src/verihealth.compact
