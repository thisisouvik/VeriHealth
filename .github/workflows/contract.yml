name: Compact Smart Contract

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Compact Compiler Directly
      run: |
        curl -sL -o compact.tar.xz https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-x86_64-unknown-linux-musl.tar.xz
        tar -xf compact.tar.xz

    - name: Compile Contracts
      run: |
        # Dynamically find the extracted binary using absolute path
        COMPACT_BIN=$(find $(pwd) -name "compact" -type f -executable | head -n 1)
        
        if [ -z "$COMPACT_BIN" ]; then
          echo "Could not find compact binary in extracted archive!"
          exit 1
        fi
        
        echo "Found compiler multiplexer at: $COMPACT_BIN"
        
        # Initialize and update the default toolchain
        $COMPACT_BIN update
        
        cd contracts
        $COMPACT_BIN compile ./src/verihealth.compact
